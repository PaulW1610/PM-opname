name: photo_organizer_app
description: A Flutter app that tags camera photos and saves them to iCloud Photos albums by address.
version: 2.7.0+22

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.3
  camera: ^0.10.0
  permission_handler: ^11.3.1
  geolocator: ^9.0.2
  geocoding: ^2.1.1
  gal: ^2.3.3
  image: ^3.3.0
  path_provider: 2.0.15
  shared_preferences: ^2.0.15
  flutter_email_sender: ^6.0.3
  pdf: ^3.8.4
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.10.0

dependency_overrides:
  path_provider_foundation: 2.2.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/images/
    - assets/metadata_template.xml
    - assets/import_template.xml

# Configuration for flutter_launcher_icons
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"